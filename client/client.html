<!DOCTYPE html>
<html lang="en">
<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  
  <script>

    const handleResponse = async (response) => {
      const content = document.getElementById('content');

      switch(response.status){
        case 200:
          content.innerHTML = '<b>Success</b>';
          break;
        case 400:
          content.innerHTML = '<b>Bad Request</b>';
          break;
        case 404:
          content.innerHTML = '<b>Not found</b>';
          break;
        case 401:
          content.innerHTML = '<b>Unauthorized</b>';
          break;
        case 403:
          content.innerHTML = '<b>Forbidden</b>';
          break;
        case 500:
          content.innerHTML = '<b>Internal</b>';
          break;
        case 501:
          content.innerHTML = '<b>Not Implimented</b>'
          break;
        default:
          content.innerHTML = '<b>Resource Not Found</b>';
          break;
      }

      response.text().then((resText) => {
        const contentType = response.headers.get('Content-Type');

        console.log(resText);

        if(contentType === 'application/json') {
          //Parse the json back into a javascript object, and display the data.
          const parsedResponse = JSON.parse(resText);
          content.innerHTML += `<p>Message: ${parsedResponse.message}</p>`;
        } else if (contentType === 'text/xml') { //If the server sent back xml
          //Parse the xml into a document and select the data out.
          const parsedResponse = new window.DOMParser().parseFromString(resText, 'text/xml');
          content.innerHTML += `<p>Message: ` + parsedResponse.querySelector('message').textContent + '</p>';
        }

      });
    };
    
    const sendFetch = async (url, acceptedType) => {

       const options = {
        method: 'GET',
        headers: {'Accept': acceptedType},
      }
     // fetch(url,options).then((response)=>console.log(response));
      fetch(url,options).then((response)=> {handleResponse(response)});
    };

    var pageValue;
    var typeValue;


    const init = () => {
      const sendButton = document.querySelector("#send");

      pageValue =  document.getElementById("page").value;
      typeValue =  document.getElementById("type").value;

      document.getElementById("page").addEventListener("change", function () {
        pageValue = this.value;
      });

       document.getElementById("type").addEventListener("change", function () {
       typeValue = this.value;
      });


      sendButton.addEventListener('click', () => sendFetch(pageValue, typeValue));
    };

    window.onload = init;
  </script>
</head>
<body>
  <section id="top">
    <h3>Status Code Tests</h3>
    <select id="page">
      <option value="/success">Success</option>
      <option value="/badRequest">Bad Request</option>
      <option value="/unauthorized">Unauthorized</option>
      <option value="/forbidden">Forbidden</option>
      <option value="/internal">Internal</option>
      <option value="/notImplemented">Not Implemented</option>
      <option value="/notFound">Not Found</option>
    </select>
    <select id="type">
      <option value="application/json">JSON</option>
      <option value="text/xml">XML</option>
    </select>
    <button id="send">Send</button>
  </section>
  <section id="content">
  </section>
</body>
</html>
